# DynamoDB Local — the store behind `npm run dev`.
#
#   docker compose up -d     # endpoint on http://localhost:8000
#   npm run dev              # QUORUM_ENV=local: points here, creates the table
#   docker compose down      # the named volume survives; add -v to wipe it
#
# The table is created by the server on boot, but only in local development:
# the task role in production has no CreateTable, deliberately, because
# Terraform owns the schema. `npm run dev` with nothing listening on :8000
# still starts — it logs that it fell back to memory and that nothing will
# survive a restart, which is a working server with a loud caveat rather than
# a stack trace. `npm run dev:memory` asks for that on purpose.
#
# Local rather than a real table: the service writes a snapshot on every
# accepted event, and doing that against AWS from a laptop costs credentials, a
# shared table two people fight over, and a network round trip in the middle of
# the game loop.

services:
  dynamodb:
    image: amazon/dynamodb-local:2.5.2
    container_name: quorum-dynamodb
    ports:
      - "8000:8000"
    working_dir: /home/dynamodblocal
    # -sharedDb: one database file whatever credentials or region the SDK is
    # configured with. Without it, local DynamoDB files are keyed by access key
    # and region, and a session written under one set of fake credentials is
    # invisible to a process started with another. That is a confusing hour.
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-dbPath", "/home/dynamodblocal/data"]
    # The image's own user does not own a fresh named volume, so it cannot
    # create the database file. Root is fine for a throwaway local container.
    user: root
    volumes:
      # Named, not a bind mount: a session survives a restart, which is exactly
      # the case `replay()` exists for and the only way to rehearse recovery.
      - quorum-dynamodb-data:/home/dynamodblocal/data

volumes:
  quorum-dynamodb-data:
