<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0A0A0F" />
    <meta name="color-scheme" content="dark light" />
    <script>
      // Before first paint: a viewer who chose light must not see a dark
      // frame first. Mirrors shared/theme.ts; keep the key in step.
      try {
        var t = localStorage.getItem("quorum.theme.v1");
        if (t === "light" || t === "dark")
          document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    </script>
    <title>Quorum</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans+Condensed:wght@700&family=IBM+Plex+Sans:wght@400;600&display=swap"
    />
    <link rel="stylesheet" href="/client/shared/tokens.css" />
    <link rel="stylesheet" href="/client/participant/participant.css" />
  </head>
  <body class="phone">
    <div id="app"></div>
    <script type="module" src="/client/participant/main.js"></script>
  </body>
</html>
