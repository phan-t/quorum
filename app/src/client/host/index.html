<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <meta name="robots" content="noindex, nofollow" />
    <!-- The screen-share picker shows tab titles. This is the cheapest
         possible protection against sharing the answers. -->
    <script>
      // Before first paint: a viewer who chose light must not see a dark
      // frame first. Mirrors shared/theme.ts; keep the key in step.
      try {
        var t = localStorage.getItem("quorum.theme.v1");
        if (t === "light" || t === "dark")
          document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    </script>
    <title>Quorum host</title>
    <link rel="stylesheet" href="/client/shared/tokens.css" />
    <!-- Carbon's tokens, and the two-line bridge between the two palettes.
         Generated by scripts/gen-carbon-tokens.mjs and committed. Loaded by
         this page alone: tokens.css is the product palette and all three
         surfaces read it, so the console's side of the bridge cannot live
         there. Directly after tokens.css because the bridge re-declares
         --ground under tokens.css's own selectors and wins on source order,
         and before the two component sheets because it is still palette. -->
    <link rel="stylesheet" href="/client/host/carbon-tokens.css" />
    <!-- The participant preview is the participant view, so it needs its stylesheet. -->
    <link rel="stylesheet" href="/client/participant/participant.css" />
    <link rel="stylesheet" href="/client/host/host.css" />
    <!--
      Carbon's modules are served from this container, out of node_modules by
      way of scripts/copy-client-assets.mjs. They carry bare specifiers that a
      browser cannot resolve on its own, and this is what resolves them.

      No bundler and no CDN: a live session runs in a room, sometimes on
      conference wifi, and a console that waits on someone else's DNS before
      the host can press Next does not work at the only moment it matters.

      Hand-written and committed rather than injected at build time, because an
      injected import map is one no reviewer reads. The build crawls the import
      graph and fails if this block and what it reached disagree — a missing
      entry here is a module that 404s in the browser with nothing in any log
      on the server side.

      It has to precede the first module load below. An import map that
      arrives after one is ignored, silently.
    -->
    <script type="importmap">
      {
        "imports": {
          "@carbon/icon-helpers": "/vendor/@carbon/icon-helpers/es/index.js",
          "@carbon/icons/": "/vendor/@carbon/icons/",
          "@carbon/utilities": "/vendor/@carbon/utilities/es/index.js",
          "@carbon/web-components/": "/vendor/@carbon/web-components/",
          "@internationalized/number": "/vendor/@internationalized/number/dist/index.mjs",
          "@lit/reactive-element": "/vendor/@lit/reactive-element/reactive-element.js",
          "@lit/reactive-element/": "/vendor/@lit/reactive-element/",
          "lit": "/vendor/lit/index.js",
          "lit-element/": "/vendor/lit-element/",
          "lit-html": "/vendor/lit-html/lit-html.js",
          "lit-html/": "/vendor/lit-html/",
          "lit/": "/vendor/lit/"
        }
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/client/host/main.js"></script>
  </body>
</html>
