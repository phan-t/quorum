# Pull request checks. Nothing here touches AWS or HCP Terraform, so nothing
# here needs a credential — note the absence of an `id-token` permission and of
# any secret. A fork's PR runs these in full.
#
# There is no deploy workflow. The AWS account this runs in forbids IAM users
# and identity providers, so nothing can authenticate there except a human with
# a current session — see infra/README.md. Deploys are `make deploy`, run by a
# person. For a service that runs two hours a few times a year that is the right
# shape, not a consolation: there is no release cadence to automate, and someone
# has to be present to raise the service before an event anyway.
#
# So this file is the whole of CI, and it deliberately needs no credential:
# note the absence of an `id-token` permission and of any secret. A fork's PR
# runs it in full.

name: CI

on:
  pull_request:
    paths:
      - "app/**"
      - "infra/**"
      - ".github/workflows/**"
  # Also on main. Work lands here directly as well as through PRs, and a push
  # that skipped the checks entirely is worse than one that fails them.
  push:
    branches: [main]
    paths:
      - "app/**"
      - "infra/**"
      - ".github/workflows/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    name: typecheck and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci

      # Node strips types without checking them, so this is the only thing in
      # the whole pipeline that reads them. If it is skipped, type errors reach
      # production and surface as a runtime failure in front of a room.
      - name: tsc --noEmit
        run: npm run typecheck

      - name: unit tests
        run: npm test

  build-image:
    name: container builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      # Built, never pushed. A PR from a fork cannot assume the ECR role — its
      # OIDC subject is `pull_request`, and the trust policy names
      # `ref:refs/heads/main` exactly — so this job proves the Dockerfile still
      # builds and stops there.
      - name: docker build (no push)
        uses: docker/build-push-action@v6
        with:
          context: app
          push: false
          load: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  terraform:
    name: terraform fmt and validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.4"
          # The wrapper rewrites stdout and is only useful for capturing plan
          # output, which this job does not do.
          terraform_wrapper: false

      - name: terraform fmt -check
        run: terraform fmt -check -recursive -diff infra

      # -backend=false so no HCP Terraform token and no AWS credential is
      # needed: validate only has to resolve providers and type-check the
      # configuration. The root and every module on its own, so a module breaks
      # its own check rather than only breaking the root that calls it.
      #
      # The directory list is found rather than written out. It used to name
      # `infra/bootstrap` and `infra/envs/*` from the old three-workspace
      # layout, and went on failing on the first missing directory for every
      # push after that was consolidated into the single `quorum` workspace.
      # Now a glob matching nothing is what fails, and it says so.
      - name: terraform validate
        run: |
          set -euo pipefail
          shopt -s nullglob
          dirs=(infra infra/modules/*/)
          if [ ${#dirs[@]} -lt 2 ]; then
            echo "::error::no Terraform modules found under infra/modules — has the layout moved again?"
            exit 1
          fi
          # The root carries a `cloud` block, which `init` resolves against HCP
          # Terraform even with -backend=false. CI has no token for that, and
          # giving it one would mean naming the org in this public repo. Validate
          # needs neither, so the root is checked as a throwaway copy with the
          # block stripped; infra/ on disk is never touched.
          strip='import re,sys;p=sys.argv[1];s=open(p).read();o=re.sub(r"\n  cloud \{(?:[^{}]|\{[^{}]*\})*\}\n","\n",s,count=1);assert o!=s,"cloud block not found in "+p;open(p,"w").write(o)'
          for dir in "${dirs[@]}"; do
            echo "::group::$dir"
            target="$dir"
            if [ "$dir" = "infra" ]; then
              target="$(mktemp -d)/infra"
              cp -R infra "$target"
              rm -rf "$target/.terraform"
              python3 -c "$strip" "$target/versions.tf"
            fi
            terraform -chdir="$target" init -backend=false -input=false -no-color
            terraform -chdir="$target" validate -no-color
            echo "::endgroup::"
          done
